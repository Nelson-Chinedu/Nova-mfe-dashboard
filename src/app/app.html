<div class="px-8">
  <div class="flex justify-between">
    <div class="flex items-center gap-2">
      <div class="bg-white w-fit p-2 shadow-sm border border-slate-100 rounded-xl">
        <lucide-icon
          name="LayoutDashboard"
          fill="red"
          class="fill-current stroke-0 text-[#3c41e9]"
          [size]="24"
          color="#3c41e9"
        ></lucide-icon>
      </div>
      <div>
        <h1 class="text-[16px] font-bold text-[#0c1420]">Dashboard</h1>
        <p class="text-[#777a83] text-sm">Welcome back to Nova</p>
      </div>
    </div>
    <div>
      <button class="bg-[#3c41e9] px-4 py-2 text-sm text-white rounded-md flex items-center gap-1">
        <lucide-icon name="cloud-download" [size]="16"></lucide-icon>
        Export
      </button>
    </div>
  </div>
  <app-dashboard-summary></app-dashboard-summary>
  <div class="grid grid-cols-[66%_32%] justify-between">
    <app-work-hours></app-work-hours>
    <app-events></app-events>
  </div>
  <div class="grid grid-cols-2 gap-4 my-4">
    <app-employees></app-employees>
    <app-schedule></app-schedule>
  </div>
</div>
