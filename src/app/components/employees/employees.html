<div class="bg-white border border-[#dadedf] h-105 p-4 rounded-xl">
  <div class="flex justify-between items-center mb-4">
    <p class="text-[16px] font-bold text-[#0c1420]">Employee</p>
    <button
      class="text-sm border border-[#dadedf] text-[#777a83] cursor-pointer font-medium px-2 py-1 rounded-lg"
    >
      See Details
    </button>
  </div>
  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="employee_name">
        <th mat-header-cell *matHeaderCellDef>Employee Name</th>
        <td mat-cell *matCellDef="let element">{{ element.employee_name }}</td>
      </ng-container>

      <ng-container matColumnDef="department">
        <th mat-header-cell *matHeaderCellDef>Department</th>
        <td mat-cell *matCellDef="let element">{{ element.department }}</td>
      </ng-container>

      <ng-container matColumnDef="job_title">
        <th mat-header-cell *matHeaderCellDef>Job Title</th>
        <td mat-cell *matCellDef="let element">{{ element.job_title }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-red-400 text-white"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
